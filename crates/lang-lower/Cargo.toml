[package]
name = "mucad-lang-lower"
description = "µcad language lower compiler stage and intermediate representation (IR)"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
derive_more = { version = "2.0.1", features = [
    "deref",
    "deref_mut",
    "display",
    "debug",
] }
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
rustc-hash = "2.1.1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.17"
ron = { version = "0.12", features = ["integer128"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.21", features = ["macros"] }

mucad-lang-base = { workspace = true }
mucad-macros = { workspace = true }
mucad-lang-parse = { workspace = true }
mucad-lang-types = { workspace = true }
mucad-builtin = { workspace = true }


[dev-dependencies]
pretty_assertions = "1.4"
insta = "1.48.0"
test-that = "0.6"
