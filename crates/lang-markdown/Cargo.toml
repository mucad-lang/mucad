[package]
name = "mucad-lang-markdown"
description = "µcad language markdown support"
documentation = "https://docs.rs/mucad-lang-markdown"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true

[[bin]]
name = "mucad-lang-markdown-extract"
path = "extract.rs"
required-features = ["bin_extract"]


[dependencies]
derive_more = { version = "2", features = ["deref", "deref_mut"] }
pulldown-cmark = { version = "0.13", default-features = false }
toml_edit = "0.25"
thiserror = "2.0"
miette = "7.3.0"

# Used by md-extractor
clap = { version = "4", features = ["derive"], optional = true }

mucad-lang-base = { workspace = true }

[dev-dependencies]
insta = "1.45.0"
tempfile = "3.27.0"

[features]
# Dependencies for md extractor
bin_extract = ["dep:clap"]
