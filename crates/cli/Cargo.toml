[package]
name = "mucad"
description = "µcad Command Line Interface"
documentation = "https://docs.rs/mucad"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
default-run = "mucad"

[[bin]]
name = "mucad"
path = "main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
env_logger = "0.11"
lazy_static = "1.4"
log = "0.4"
toml = "1.1.2"
dirs = "6"
num-format = "0.4"
rust-embed = "8.9"
miette = { version = "7.6.0", features = ["fancy"] }
base64 = "0.23"
qrcode = { version = "0.14", default-features = false }

mucad-driver = { workspace = true }

[build-dependencies]
walkdir = "2"
miette = "7.6.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
