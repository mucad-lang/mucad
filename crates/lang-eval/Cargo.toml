[package]
name = "mucad-lang-eval"
description = "µcad language eval compiler stage"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
rustc-hash = "2.1.1"
thiserror = "2.0.17"

mucad-lang-base = { workspace = true }
mucad-macros = { workspace = true }
mucad-lang-types = { workspace = true }
mucad-lang-resolve = { workspace = true }
mucad-builtin = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4"
insta = "1.48.0"
test-case = "3.4.0"
