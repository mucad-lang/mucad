[package]
name = "microcad-builtin"
description = "Provides the built-in functionalities available in the µcad language."
documentation = "https://docs.rs/microcad-std"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
log = "0.4"
cgmath = "0.18"
derive_more = { version = "2", features = ["deref", "deref_mut", "from", "display", "debug"] }
dirs = "6"
geo = "0.33"
miette = "7.6.0"
phf = { version = "0.14", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
typetag = "0.2"

microcad-lang-base = { workspace = true }
microcad-lang-types = { workspace = true }
microcad-macros = { workspace = true }
