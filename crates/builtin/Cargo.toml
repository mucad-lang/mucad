[package]
name = "mucad-builtin"
description = "Provides the built-in functionalities available in the µcad language."
documentation = "https://docs.rs/mucad-std"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
derive_more = { version = "2", features = ["deref", "deref_mut", "from", "display", "debug"] }
miette = "7.6.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

mucad-lang-base = { workspace = true }
mucad-lang-types = { workspace = true }
mucad-macros = { workspace = true }
