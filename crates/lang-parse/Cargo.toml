[package]
name = "mucad-lang-parse"
description = "µcad language syntax lexer and parser"
documentation = "https://docs.rs/mucad-lang-parse"
authors.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
chumsky = { version = "0.13.0", optional = true }
derive_more = { version = "2", features = ["deref"] }
either = "1.15.0"
logos = "0.16.0"
miette = "7.6.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.17"

mucad-lang-base = { workspace = true }
mucad-macros = { workspace = true }

[dev-dependencies]
insta = { version = "1.45.0" }
test-case = "3.3.1"
miette = { version = "7.6.0", features = ["fancy"] }

[features]
default = ["parser"]
parser = ["dep:chumsky"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
