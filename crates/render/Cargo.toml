[package]
name = "microcad-render"
description = "µcad render utilities"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
cgmath = { version = "0.18", features = ["serde"] }
derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
rustc-hash = "2.1.1"
thiserror = "2.0.17"

microcad-core = { workspace = true }
microcad-hash = { workspace = true }
microcad-lang-base = { workspace = true }
microcad-macros = { workspace = true }
microcad-lang-types = { workspace = true }
microcad-builtin = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4"
insta = "1.45.0"
