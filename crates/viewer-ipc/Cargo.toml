[package]
name = "mucad-viewer-ipc"
description = "µcad Viewer Interprocess Communication API"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "mucad-viewer-ipc-manual-test"
path = "manual_test.rs"

[dependencies]
miette = "7.6.0"
crossbeam = "0.8"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wkt = "0.14"

mucad-core = { workspace = true }
mucad-builtin = { workspace = true }
mucad-lang-base = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
