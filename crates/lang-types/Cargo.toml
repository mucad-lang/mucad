[package]
name = "mucad-lang-types"
description = "µcad language types"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytemuck = "1.24.0"
cgmath = { version = "0.18", features = ["serde"] }
derive_more = { version = "2.0.1", features = [
    "deref",
    "deref_mut",
    "display",
    "debug",
] }
fixed = { version = "1.31", features = ["serde"] }
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
round = "0.1.2"
rustc-hash = "2.1.1"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0.17"
typetag = "0.2"

mucad-lang-base = { workspace = true }
mucad-macros = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4"
insta = "1.45.0"
