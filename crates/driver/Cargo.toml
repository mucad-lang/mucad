[package]
name = "mucad-driver"
description = "µcad high-level API"
documentation = "https://docs.rs/mucad-lang-base"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
notify = "8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.17"
toml = { version = "1.1.2", features = ["serde"] }
url = "2.5.7"

mucad-builtin = { workspace = true }
mucad-core = { workspace = true }
mucad-render = { workspace = true }
mucad-docgen = { workspace = true }
mucad-export = { workspace = true }
mucad-lang-base = { workspace = true }
mucad-lang-eval = { workspace = true }
mucad-lang-format = { workspace = true }
mucad-lang-lower = { workspace = true }
mucad-lang-markdown = { workspace = true }
mucad-lang-parse = { workspace = true }
mucad-lang-resolve = { workspace = true }
mucad-lang-types = { workspace = true }
mucad-std = { workspace = true }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
test-case = "3.4.0"
