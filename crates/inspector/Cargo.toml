[package]
name = "mucad-inspector"
description = "µcad Inspector"
documentation = "https://docs.rs/mucad-inspector"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
default-run = "mucad-inspector"

[[bin]]
name = "mucad-inspector"
path = "main.rs"

[dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
clap = { version = "4", features = ["derive"] }
crossbeam = "0.8"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
toml = "1.1.2"
slint = "1.13"

mucad-driver = { workspace = true }
mucad-viewer-ipc = { workspace = true }


[build-dependencies]
slint-build = "1.13"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
