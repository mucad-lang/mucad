[package]
name = "mucad-lsp"
description = "LSP implementation for µcad language"
documentation = "https://docs.rs/mucad-lsp"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
keywords = ["mucad", "lsp", "language"]
categories = ["development-tools"]

[dependencies]
miette = "7.6.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
env_logger = "0.11.8"
log = "0.4"
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
tower-lsp = "0.20"

mucad-driver = { workspace = true }
mucad-viewer-ipc = { workspace = true }

[dev-dependencies]
test-that = "0.6"

mucad-driver = { workspace = true }

[[bin]]
name = "mucad-lsp"
path = "src/server.rs"
