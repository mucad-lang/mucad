[package]
name = "mucad-core"
description = "µcad core"
documentation = "https://docs.rs/mucad-core"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
bytemuck = "1.24.0"
cgmath = { version = "0.18", features = ["serde"] }
derive_more = { version = "2", features = ["deref", "deref_mut", "from"] }
geo = { version = "0.33", features = ["use-serde"] }
manifold-rust = { version = "0.19" }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
miette = "7.6.0"
bezier-rs = "0.5"
svgtypes = "0.16.1"

mucad-hash = { workspace = true }

[dev-dependencies]
test-case = "3.4.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
