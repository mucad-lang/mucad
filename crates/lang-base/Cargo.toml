[package]
name = "mucad-lang-base"
description = "µcad language basics"
documentation = "https://docs.rs/mucad-lang-base"
authors.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
bytemuck = "1.25.0"
color-print = { version = "0.3", optional = true }
compact_str = { version = "0.10.0", features = ["serde"] }
derive_more = { version = "2.1.1", features = [
    "debug",
    "deref",
    "deref_mut",
    "display",
    "from",
    "from_str",
] }
dissimilar = "1.0.11"
indextree = { version = "4.8", features = ["deser", "macros"] }
indextree-macros = "0.1.3"
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
pathdiff = "0.2"
postcard = { version = "1.1", features = ["alloc"] }
ron = "0.12"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }

mucad-hash = { workspace = true }

[features]
default = ["ansi-color", "io"]
io = []
ansi-color = ["dep:color-print"]
