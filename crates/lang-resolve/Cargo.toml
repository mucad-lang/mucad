[package]
name = "mucad-lang-resolve"
description = "µcad language resolve compiler stage"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
custom_debug = "0.6"
derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }
log = "0.4"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
postcard = { version = "1.1", features = ["alloc"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
toml = "1.1.4"

mucad-builtin = { workspace = true }
mucad-lang-base = { workspace = true }
mucad-macros = { workspace = true }
mucad-lang-lower = { workspace = true }
mucad-lang-types = { workspace = true }

# Dependent on parse feature
mucad-lang-parse = { workspace = true, optional = true }


[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27"
test-case = "3.4.0"
test-that = "0.6"

[features]
default = [
    "parse", # This feature is supposed to removed once we have an abstraction in `mucad-driver`
]
parse = ["dep:mucad-lang-parse"]
