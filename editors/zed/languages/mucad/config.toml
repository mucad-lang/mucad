name = "µcad"
grammar = "mucad"
path_suffixes = ["mu", "µcad", "mcad", "ucad"]
line_comments = ["// ", "/// ", "//! "]
block_comment = ["/*", "*/"]
tab_size = 4
autoclose_before = ";:.,=}])"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["'"]
