<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>µcad web viewer</title>
    </head>
    <body>
        <header>
            <a
                href="https://mucad.org"
                target="_blank"
                rel="noopener noreferrer"
                class="logo"
                style="
                    position: relative;
                    display: inline-block;
                    text-decoration: none;
                "
            >
                <img
                    src="./src/assets/logo_big.svg"
                    alt="Big Logo"
                    style="width: auto; height: 64px"
                />
                <span
                    id="version-tag"
                    style="
                        position: absolute;
                        bottom: 2px;
                        right: 4px;
                        font-size: 11px;
                    "
                ></span>
            </a>
            <label>
                <select id="examples"></select>
            </label>
            <button id="save" title="Save, format and compile the code">Save <kbd class="shortcut-key">S</kbd></button>
            <button id="compile">Compile <kbd class="shortcut-key">Enter</kbd></button>
            <label class="toggle" title="Compile after each change">
                <input type="checkbox" id="auto-update" checked />
                Auto-update
            </label>
            <button id="format">Format <kbd class="shortcut-key">F</kbd></button>
            <span class="dropdown">
                <button id="share" title="Export the model, or share the code as link or QR code">Share ▾</button>
                <div id="share-panel" class="dropdown-panel" hidden>
                    <button id="export" disabled><div id="export-btn-caption">Export</div> <kbd class="shortcut-key">E</kbd></button>
                    <button id="copy-link" title="Copy a link with the code to the clipboard">Copy link</button>
                    <label class="toggle" title="Share the code without comments, e.g. if it is too long for a link">
                        <input type="checkbox" id="strip-comments" />
                        Strip comments
                    </label>
                    <p id="share-error" hidden></p>
                    <canvas id="qr-canvas"></canvas>
                    <button id="qr-download">Download QR code as PNG</button>
                </div>
            </span>

            <span id="status"></span>

            <a
                href="https://rust.services"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-link"
                id="rust-services"
                style="margin-left: auto"
            >
                Proudly made by
                <span class="rustservices-icon"></span>
            </a>

            <a
                href="https://codeberg.org/mucad/mucad/issues"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-link btn-bright"
                id="reportbug"
            >
                Report a bug
            </a>

            <a
                href="https://codeberg.org/mucad/mucad"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-link"
                id="codeberg-link"
            >
                <span class="codeberg-icon"></span>
            </a>
        </header>
        <main id="dock"></main>
        <!-- The panel contents, which are moved into the dock. -->
        <div hidden>
            <div id="editor" class="panel"></div>
            <section id="view" class="panel"></section>
            <pre id="diagnostics" class="panel"></pre>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
