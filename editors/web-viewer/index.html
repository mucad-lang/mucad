<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>µcad web viewer</title>
  </head>
  <body>
    <header>
      <span class="logo">µcad</span>
      <label>
        Example
        <select id="examples"></select>
      </label>
      <span id="status"></span>
      <button id="reset-layout" title="Restore the default arrangement of the panels">
        Reset layout
      </button>
      <button id="export" disabled>Export</button>
    </header>
    <main id="dock"></main>
    <!-- The panel contents, which are moved into the dock. -->
    <div hidden>
      <div id="editor" class="panel"></div>
      <section id="view" class="panel"></section>
      <pre id="diagnostics" class="panel"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
