<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>µcad web viewer</title>
    </head>
    <body>
        <header>
            <a href="https://mucad.org" target="_blank" rel="noopener noreferrer" class="logo" style="position: relative; display: inline-block; text-decoration: none;">
                <img
                    src="logo_big.svg"
                    alt="Big Logo"
                    style="width: auto; height: 64px"
                />
                <span id="version-tag" style="position: absolute; bottom: 2px; right: 4px; font-size: 11px"></span>
            </a>
            <label>
                Example
                <select id="examples"></select>
            </label>
            <button id="export" disabled>Export</button>

            <span id="status"></span>

            <button id="reportbug">I found a bug</button>
            <button id="code">Codeberg</button>
        </header>
        <main id="dock"></main>
        <!-- The panel contents, which are moved into the dock. -->
        <div hidden>
            <div id="editor" class="panel"></div>
            <section id="view" class="panel"></section>
            <pre id="diagnostics" class="panel"></pre>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
