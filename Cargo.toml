[workspace]
members = [
    "crates/builtin",
    "crates/cli",
    "crates/core",
    "crates/docgen",
    "crates/driver",
    "crates/export",
    "crates/hash",
    "crates/import",
    "crates/lang-base",
    "crates/lang-eval",
    "crates/lang-format",
    "crates/lang-lower",
    "crates/lang-markdown",
    "crates/lang-parse",
    "crates/lang-resolve",
    "crates/lang-types",
    "crates/lsp",
    "crates/macros",
    "crates/render",
    "crates/std",
    "crates/viewer",
    "crates/viewer-ipc",
    "crates/wasm",
    "crates/inspector",

    "editors/zed",

     "xtask",
]

default-members = [
    "crates/builtin",
    "crates/cli",
    "crates/core",
    "crates/docgen",
    "crates/driver",
    "crates/export",
    "crates/hash",
    "crates/import",
    "crates/lang-base",
    "crates/lang-eval",
    "crates/lang-format",
    "crates/lang-lower",
    "crates/lang-markdown",
    "crates/lang-parse",
    "crates/lang-resolve",
    "crates/lang-types",
    "crates/macros",
    "crates/render",
    "crates/std",
    "crates/viewer",
    "crates/wasm",

    "xtask",
]

resolver = "2"

[workspace.package]
description = "µcad: A CAD programming language for everybody"
authors = [
    "Michael Winkelmann (michael@winkelmann.site)",
]
version = "0.6.0"
edition = "2024"
homepage = "https://mucad.org"
repository = "https://codeberg.org/mucad/mucad"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
keywords = ["cad", "geometry", "3d", "cnc", "openscad"]

[workspace.dependencies]
mucad-builtin = { path = "crates/builtin", version = "0.6.0" }
mucad-core = { path = "crates/core", version = "0.6.0" }
mucad-docgen = { path = "crates/docgen", version = "0.6.0" }
mucad-driver = { path = "crates/driver", version = "0.6.0" }
mucad-export = { path = "crates/export", version = "0.6.0" }
mucad-hash = { path = "crates/hash", version = "0.6.0" }
mucad-import = { path = "crates/import", version = "0.6.0" }
mucad-lang-base = { path = "crates/lang-base", version = "0.6.0" }
mucad-lang-eval = { path = "crates/lang-eval", version = "0.6.0" }
mucad-lang-format = { path = "crates/lang-format", version = "0.6.0" }
mucad-lang-lower = { path = "crates/lang-lower", version = "0.6.0" }
mucad-lang-markdown = { path = "crates/lang-markdown", version = "0.6.0" }
mucad-lang-parse = { path = "crates/lang-parse", version = "0.6.0" }
mucad-lang-resolve = { path = "crates/lang-resolve", version = "0.6.0" }
mucad-lang-types = { path = "crates/lang-types", version = "0.6.0" }
mucad-lsp = { path = "crates/lsp", version = "0.6.0" }
mucad-macros = { path = "crates/macros", version = "0.6.0" }
mucad-render = { path = "crates/render", version = "0.6.0" }
mucad-std = { path = "crates/std", version = "0.6.0" }
mucad-viewer-ipc = { path = "crates/viewer-ipc", version = "0.6.0" }
mucad-viewer = { path = "crates/viewer", version = "0.6.0" }
